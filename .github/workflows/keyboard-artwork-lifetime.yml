name: Keyboard artwork native resource regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/UnifiedRgb.Host/Services/KeyboardStatusArtwork.cs'
      - 'src/UnifiedRgb.Host/Services/KeyboardSceneCycleOverlay.cs'
      - 'tests/UnifiedRgb.Host.Tests/KeyboardArtworkLifetimeTests.cs'
      - 'tests/UnifiedRgb.Host.Tests/RogNativeMenuSourceTests*.cs'
      - '.github/workflows/keyboard-artwork-lifetime.yml'

permissions:
  contents: read

jobs:
  actual-wpf-lifetime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.402
      - name: Strict build of actual WPF regressions
        run: dotnet build tests/UnifiedRgb.Host.Tests/UnifiedRgb.Host.Tests.csproj -c Release -warnaserror
      - name: Initialize the runner's Chinese font cache before measuring artwork
        shell: powershell
        run: |
          Add-Type -AssemblyName PresentationCore,PresentationFramework,WindowsBase
          try {
            $visual = New-Object System.Windows.Media.DrawingVisual
            $context = $visual.RenderOpen()
            try {
              $font = New-Object System.Windows.Media.Typeface 'Microsoft YaHei UI'
              $text = New-Object System.Windows.Media.FormattedText('光域任务窗口资源回归检查场景已应用', [Globalization.CultureInfo]::InvariantCulture, [Windows.FlowDirection]::LeftToRight, $font, 17, [Windows.Media.Brushes]::White, 1.0)
              $context.DrawText($text, (New-Object Windows.Point(0, 0)))
            } finally { $context.Close() }
            $bitmap = New-Object Windows.Media.Imaging.RenderTargetBitmap(208, 64, 96, 96, [Windows.Media.PixelFormats]::Pbgra32)
            $bitmap.Render($visual)
          } finally { [Windows.Threading.Dispatcher]::CurrentDispatcher.InvokeShutdown() }
      - name: Fixed real render, failure cleanup and native resource soak
        id: lifetime
        shell: pwsh
        run: |
          dotnet test tests/UnifiedRgb.Host.Tests/UnifiedRgb.Host.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~KeyboardArtworkLifetimeTests' --logger 'trx;LogFileName=fixed-lifetime.trx' --logger 'console;verbosity=detailed' --results-directory TestResults/Artwork
          if ($LASTEXITCODE -ne 0) { throw 'Fixed WPF lifetime regression failed' }
      - name: USB and RF production connection regressions
        shell: pwsh
        run: |
          dotnet test tests/UnifiedRgb.Host.Tests/UnifiedRgb.Host.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~RogNativeMenuSourceTests.LocalImageAbort_|FullyQualifiedName~RogNativeMenuSourceTests.Actual_transport_|FullyQualifiedName~RogNativeMenuSourceTests.Actual_RF_USB_RF_|FullyQualifiedName~RogNativeMenuSourceTests.Confirmed_USB_absence_' --logger 'trx;LogFileName=keyboard-transports.trx' --results-directory TestResults/Artwork
          if ($LASTEXITCODE -ne 0) { throw 'Keyboard transport regression failed' }
      - name: Prove old production code fails the same resource checks
        if: always() && steps.lifetime.outcome == 'success'
        shell: pwsh
        run: |
          $baseline = '70413eb4aecd2029e07a07dc5fc2ba92f76c1701'
          foreach ($path in @('src/UnifiedRgb.Host/Services/KeyboardStatusArtwork.cs', 'src/UnifiedRgb.Host/Services/KeyboardSceneCycleOverlay.cs')) {
            $old = git show "${baseline}:$path"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read frozen baseline' }
            [IO.File]::WriteAllText((Join-Path $PWD $path), ($old -join "`n"))
          }
          dotnet build tests/UnifiedRgb.Host.Tests/UnifiedRgb.Host.Tests.csproj -c Release -warnaserror --no-incremental
          if ($LASTEXITCODE -ne 0) { throw 'Baseline must build before characterization' }
          dotnet test tests/UnifiedRgb.Host.Tests/UnifiedRgb.Host.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~KeyboardArtworkLifetimeTests' --logger 'trx;LogFileName=baseline-lifetime.trx' --logger 'console;verbosity=detailed' --results-directory TestResults/Artwork
          $baselineExit = $LASTEXITCODE
          [xml]$trx = Get-Content TestResults/Artwork/baseline-lifetime.trx
          $failed = @($trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed')
          if ($baselineExit -eq 0 -or $failed.Count -ne 3) { throw 'Expected all three frozen-baseline regressions to fail' }
          $messages = ($failed | ForEach-Object { $_.Output.ErrorInfo.Message }) -join "`n"
          if ($messages -notmatch 'HasShutdownFinished' -or $messages -notmatch 'Atoms') { throw 'Baseline failed for an unexpected reason' }
          Write-Output 'Old code leaks native window resources; fixed code passes the identical checks.'
          exit 0
      - name: Preserve actual native resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Keyboard-Artwork-Lifetime
          path: TestResults/Artwork/
