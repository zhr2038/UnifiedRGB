name: Windows 构建与测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Restore
        run: dotnet restore src/UnifiedRgb.sln
      - name: Verify .NET 8 SDK
        shell: pwsh
        run: |
          $version = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^8\.') { throw "Expected .NET 8 SDK, got $version" }
          Write-Output "Selected SDK: $version"
      - name: Build
        run: dotnet build src/UnifiedRgb.sln -c Release --no-restore -warnaserror
      - name: Test
        # The scheduler benchmark must not compete with the WPF encoding suites in other test processes.
        run: dotnet test src/UnifiedRgb.sln -c Release --no-build -m:1 --logger trx --results-directory TestResults
      - name: Scene package authoring tools
        run: python -m unittest discover -s tools/scene-packages -p "test_*.py"
      - name: Installation lifecycle (Windows PowerShell 5.1, fake platform)
        shell: powershell
        run: ./tools/windows/installation-qa/Invoke-InstallationQa.ps1 -WorkRoot "$env:RUNNER_TEMP/urgb-installation-qa-ps51"
      - name: Installation lifecycle (PowerShell 7, fake platform)
        shell: pwsh
        run: ./tools/windows/installation-qa/Invoke-InstallationQa.ps1 -WorkRoot "$env:RUNNER_TEMP/urgb-installation-qa-ps7"
      - name: Report test counts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$result = Get-Content -LiteralPath $_.FullName
            $counts = $result.TestRun.ResultSummary.Counters
            $skipped = @($result.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'NotExecuted').Count
            Write-Output "$($_.Name): total=$($counts.total), passed=$($counts.passed), failed=$($counts.failed), skipped=$skipped"
          }
