name: Windows 构建与测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Restore
        run: dotnet restore src/UnifiedRgb.sln
      - name: Verify .NET 10 SDK
        shell: pwsh
        run: |
          $version = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^10\.') { throw "Expected .NET 10 SDK, got $version" }
          Write-Output "Selected SDK: $version"
      - name: Build
        run: dotnet build src/UnifiedRgb.sln -c Release --no-restore -warnaserror
      - name: Test
        # Both performance suites run in fresh, required quiet steps below with their original thresholds.
        env:
          S1B_CAPTURE_DIR: ${{ github.workspace }}/TestResults/ScreenCaptures
        run: dotnet test src/UnifiedRgb.sln -c Release --no-build -m:1 --filter 'FullyQualifiedName!~UnifiedRgb.Core.Tests.ClockTests&FullyQualifiedName!~UnifiedRgb.Host.Tests.SoakTests' --logger trx --results-directory TestResults
      - name: Quiet real-clock benchmark (unchanged 2 ms gate)
        shell: pwsh
        run: |
          dotnet build-server shutdown
          if ($LASTEXITCODE -ne 0) { throw 'Build services did not stop' }
          dotnet test tests/UnifiedRgb.Core.Tests/UnifiedRgb.Core.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~UnifiedRgb.Core.Tests.ClockTests' --logger trx --results-directory TestResults/Timing
          if ($LASTEXITCODE -ne 0) { throw 'The unchanged real-clock benchmark failed' }
      - name: Quiet resource soak (unchanged workload and limits)
        run: dotnet test tests/UnifiedRgb.Host.Tests/UnifiedRgb.Host.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~UnifiedRgb.Host.Tests.SoakTests' --logger trx --results-directory TestResults/Soak
      - name: Scene package authoring tools
        run: python -m unittest discover -s tools/scene-packages -p "test_*.py"
      - name: Generic effect generator reproducibility (read-only)
        run: python tools/codegen/gen_effects.py --check
      - name: Installation lifecycle (Windows PowerShell 5.1, fake platform)
        shell: powershell
        run: ./tools/windows/installation-qa/Invoke-InstallationQa.ps1 -WorkRoot (Join-Path ([IO.Path]::GetTempPath()) 'urgb-installation-qa-ps51')
      - name: Installation lifecycle (PowerShell 7, fake platform)
        shell: pwsh
        run: ./tools/windows/installation-qa/Invoke-InstallationQa.ps1 -WorkRoot (Join-Path ([IO.Path]::GetTempPath()) 'urgb-installation-qa-ps7')
      - name: Preserve software test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Guangyu-TestResults
          path: TestResults/
      - name: Report test counts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$result = Get-Content -LiteralPath $_.FullName
            $counts = $result.TestRun.ResultSummary.Counters
            $skipped = @($result.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'NotExecuted').Count
            Write-Output "$($_.Name): total=$($counts.total), passed=$($counts.passed), failed=$($counts.failed), skipped=$skipped"
          }

  installer-lifecycle:
    # A separate VM keeps installation feedback independent of the software timing suite. Both jobs must pass.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.402
      - name: Resolve hash-pinned installer tool
        shell: pwsh
        run: |
          $compiler = ./tools/packaging/Get-Nsis.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'urgb-pinned-nsis')
          "URGB_NSIS=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build self-contained Windows installer
        shell: pwsh
        run: ./tools/packaging/Build-Windows.ps1 -Output .artifacts-windows-release -MakeNsis $env:URGB_NSIS
      - name: Real elevated install, upgrade and uninstall (disposable runner)
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem .artifacts-windows-release -Filter '*Setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          ./tools/packaging/Test-RealInstaller.ps1 -Installer $installers[0].FullName
      - name: Preserve installer and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Guangyu-Windows-x64
          include-hidden-files: true
          path: |
            .artifacts-windows-release/*Setup.exe
            .artifacts-windows-release/SHA256SUMS
            .artifacts-windows-release/payload-sha256.json
            .artifacts-windows-release/payload/DEPENDENCIES.json
            InstallerResults/
